name: Build & Release Dorado

on:
  push:
    branches: [main]
    tags: ['dorado-v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Serialize publishes per ref so the keep-last-N prune never races a sibling run.
concurrency:
  group: publish-dorado-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            name: Linux-x64
            archive: tar.gz
          - os: ubuntu-latest
            rid: linux-arm64
            name: Linux-arm64
            archive: tar.gz
          - os: windows-latest
            rid: win-x64
            name: Windows-x64
            archive: zip
          - os: windows-latest
            rid: win-arm64
            name: Windows-arm64
            archive: zip

    # Sibling-checkout layout so the relative ProjectReference from
    # Dorado.Infrastructure.External to ../dorado-cloud resolves (see AGENTS.md).
    defaults:
      run:
        working-directory: dorado

    steps:
      - name: Checkout Dorado
        uses: actions/checkout@v4
        with:
          path: dorado

      - name: Checkout Dorado Cloud (sibling project reference)
        uses: actions/checkout@v4
        with:
          repository: project-dorado/dorado-cloud
          path: dorado-cloud

      - name: Setup .NET 8.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run Unit Tests
        run: dotnet test Dorado.sln -c Release --verbosity normal

      - name: Publish Standalone Desktop Application
        run: >
          dotnet publish src/Dorado.Desktop/Dorado.Desktop.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -o publish/${{ matrix.rid }}

      - name: Verify vendored BASS natives ship
        if: matrix.rid != 'win-arm64'
        shell: bash
        run: |
          test -n "$(find publish/${{ matrix.rid }}/Native -name 'bass*' 2>/dev/null)" \
            || { echo "BASS natives missing for ${{ matrix.rid }}"; exit 1; }

      - name: Package Distribution Archive (Linux)
        if: runner.os == 'Linux'
        run: |
          tar -czvf Dorado-${{ matrix.name }}.tar.gz -C publish/${{ matrix.rid }} .

      - name: Package Distribution Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path publish\${{ matrix.rid }}\* -DestinationPath Dorado-${{ matrix.name }}.zip

      - name: Upload CI Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dorado-${{ matrix.name }}
          # upload-artifact resolves relative to the workspace root, not the job
          # working-directory, so account for the `dorado/` checkout prefix.
          path: dorado/Dorado-${{ matrix.name }}.${{ matrix.archive }}
          retention-days: 14

  publish:
    name: Publish release
    needs: build
    # Publish on every main push (auto-tagged with the commit hash), on demand,
    # and for a versioned `dorado-v*` tag. Pull requests only build + test.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/dorado-v')))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Compute short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Download build archives
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Generate Checksums
        run: |
          sha256sum Dorado-*.tar.gz Dorado-*.zip > SHA256SUMS

      - name: Import GPG Key
        if: env.HAS_GPG == 'true'
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
        env:
          HAS_GPG: ${{ secrets.GPG_PRIVATE_KEY != '' }}

      - name: Sign Checksums
        if: env.HAS_GPG == 'true'
        run: |
          gpg --batch --yes --detach-sign --armor SHA256SUMS

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            Dorado-*.tar.gz
            Dorado-*.zip
            SHA256SUMS*

      # Every main-branch commit is published as a prerelease tagged with the
      # short commit hash, so builds are downloadable at a stable per-commit URL.
      - name: Publish per-commit prerelease
        if: github.ref_type != 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dorado-${{ env.SHORT_SHA }}
          name: dorado build ${{ env.SHORT_SHA }}
          prerelease: true
          generate_release_notes: true
          files: |
            Dorado-*.tar.gz
            Dorado-*.zip
            SHA256SUMS*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A pushed `dorado-v*` tag produces a normal, versioned release.
      - name: Publish versioned release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            Dorado-*.tar.gz
            Dorado-*.zip
            SHA256SUMS*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Bound the number of per-commit prereleases; versioned tags are left alone.
      - name: Prune old prereleases (keep 10)
        if: github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tags=$(gh release list -R "$GITHUB_REPOSITORY" --limit 200 --json tagName,isPrerelease \
            --jq '[.[] | select(.isPrerelease)
                       | select(.tagName | startswith("dorado-"))
                       | select(.tagName | startswith("dorado-v") | not)
                       | .tagName] | .[10:] | .[]')
          for t in $tags; do
            echo "deleting stale prerelease $t"
            gh release delete "$t" -R "$GITHUB_REPOSITORY" --yes --cleanup-tag
          done
