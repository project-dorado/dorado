name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-24.04
    # The workspace uses sibling checkouts, and Dorado.Infrastructure.External
    # references ../dorado-cloud/clients/DoradoCloud.Client via a relative
    # ProjectReference. Run all commands from the dorado checkout so that
    # relative path resolves (see the workspace AGENTS.md).
    defaults:
      run:
        working-directory: dorado
    steps:
      - name: Checkout Dorado
        uses: actions/checkout@v4
        with:
          path: dorado

      - name: Checkout Dorado Cloud (sibling project reference)
        uses: actions/checkout@v4
        with:
          repository: project-dorado/dorado-cloud
          path: dorado-cloud

      - name: Install libVLC (video playback smoke test parity)
        run: sudo apt-get update && sudo apt-get install -y libvlc5 libvlccore9 vlc-plugin-base

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Dorado.sln

      - name: Build (Release, zero warnings policy)
        run: dotnet build Dorado.sln -c Release --no-restore /warnaserror

      - name: Test
        # Includes tests/Dorado.Tests.Visual, the golden-image regression gate.
        # A slightly looser tolerance than local defaults absorbs font rasterization
        # differences between the Fedora dev host and the ubuntu runner.
        env:
          DORADO_VISUAL_TOLERANCE: '0.08'
        run: dotnet test Dorado.sln -c Release --no-build --nologo

      - name: Design invariants audit
        run: |
          python3 - << 'EOF'
          import sys
          sys.path.insert(0, 'scripts')
          from mcp_tools import audit_design_invariants
          result = audit_design_invariants('.')
          print(result)
          assert result['status'] == 'PASSED', 'design invariant violations found'
          EOF
